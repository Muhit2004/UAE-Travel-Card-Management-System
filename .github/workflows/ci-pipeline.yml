name: Continuous Integration Pipeline

# This triggers the pipeline every time Member 1 or Member 3 pushes to sprint-1
on:
  push:
    branches: [ "sprint-1" ]
  pull_request:
    branches: [ "sprint-1" ]

permissions:
  contents: read

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for accurate SonarCloud analysis

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compile and Run Unit Tests
      # This tells the cloud server to "cd" into your backend folder first!
      working-directory: ./travelcard-system-service/card-system-service
      run: mvn clean test

    - name: SonarCloud Code Quality Scan
      # We do the exact same thing here for the scanner
      working-directory: ./travelcard-system-service/card-system-service
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: >
        mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
        -Dsonar.projectKey=Muhit2004_UAE-Travel-Card-Management-System
