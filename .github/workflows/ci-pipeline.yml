name: Continuous Integration Pipeline

# This triggers the pipeline every time Member 1 or Member 3 pushes to sprint-1
on:
  push:
    branches: [ "sprint-1" ]
  pull_request:
    branches: [ "sprint-1" ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for accurate SonarCloud analysis

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compile and Run Unit Tests
      # This command automatically finds and runs CheckinCheckoutTest, RechargeTravelCardTests, and TravelHelperTest
      run: mvn clean test -pl travelcard-system-service/card-system-service

    - name: SonarCloud Code Quality Scan
      # To make this step work, you will need to link your GitHub repo to a free SonarCloud account
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: >
        mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
        -Dsonar.projectKey=UAE-Travel-Card-System
        -pl travelcard-system-service/card-system-service
